# Приём предложений словаря (feature 016, US3): validate → normalize → dedup →
# find entryKey → conflicts → review-report → PR от бота. Изменения source/**
# НЕ мержатся автоматически — только ручное ревью (INV-ADMIN, FR-023).
#
# PR-на-ревью содержит удаление сырого батча contributions/**: при merge PR
# обработанный вклад автоматически убирается из репозитория, а source/** правит
# администратор в самом PR. Триггер ограничен main + берутся только Added/Modified
# батчи (--diff-filter=AM), поэтому merge с удалением не запускает workflow повторно.
#
# Зеркалируется в DICT_REPO; здесь хранится как исходник пайплайна.
name: contribution-intake

on:
  push:
    branches:
      - main
    paths:
      - 'contributions/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Определить новые батчи
        id: changed
        run: |
          if [ -n "${{ github.event.before }}" ]; then
            git fetch origin ${{ github.event.before }} --depth=1 || true
            # Только добавленные/изменённые json-батчи. Удаления (--diff-filter=AM их
            # исключает) не берём — иначе merge PR, удаляющий батч, зациклил бы workflow.
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'contributions/**' | grep '\.json$' || true)
          else
            # workflow_dispatch: before отсутствует — обрабатываем все батчи в репо.
            FILES=$(find contributions -name '*.json' | sort || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$FILES" ]; then echo "has_files=true" >> "$GITHUB_OUTPUT"; else echo "has_files=false" >> "$GITHUB_OUTPUT"; fi

      - name: Валидация схем (ajv)
        if: steps.changed.outputs.has_files == 'true'
        env:
          BATCH_FILES: ${{ steps.changed.outputs.files }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            npx --yes ajv-cli@5 validate \
              -s schema/contribution.schema.json \
              --spec=draft7 --all-errors --errors=text \
              -d "$f" || echo "ajv: ошибки в $f (см. выше)"
          done <<< "$BATCH_FILES"

      - name: Обработка батчей и сборка review-report
        id: report
        if: steps.changed.outputs.has_files == 'true'
        env:
          BATCH_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "## Обзор вклада в словарь" > /tmp/report.md
          echo "" >> /tmp/report.md
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "### Батч: \`$f\`" >> /tmp/report.md
            node builder/intake-cli.mjs "$f" --apply >> /tmp/report.md || exit 1
          done <<< "$BATCH_FILES"
          echo "" >> /tmp/report.md
          echo "---" >> /tmp/report.md
          echo "_Новые леммы записаны как предложения в \`source/pl/proposed-lemmas.jsonl\` (нужен перевод). Администратор при ревью добавляет перевод и переносит их в \`source/pl/lemmas.jsonl\`; builder предложения не потребляет (INV-ADMIN, FR-024)._" >> /tmp/report.md
          cat /tmp/report.md

      - name: Удалить обработанные батчи (даёт дифф для PR)
        if: steps.changed.outputs.has_files == 'true'
        env:
          BATCH_FILES: ${{ steps.changed.outputs.files }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git rm -- "$f"
          done <<< "$BATCH_FILES"

      - name: Создать PR от бота (без авто-мержа)
        if: steps.changed.outputs.has_files == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: dict-intake/${{ github.run_id }}
          title: 'Словарь: новые предложения (ревью требуется)'
          body-path: /tmp/report.md
          labels: dictionary, needs-review
          commit-message: 'intake: обработаны предложения, батчи удалены (ревью)'
          # Удаление батчей формирует дифф; source/** добавляет администратор при
          # ревью PR (INV-ADMIN). Merge PR = обработанный вклад удалён из репозитория.
